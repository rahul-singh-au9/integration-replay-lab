version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep the compiler inside the typed-lint parser's supported range.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Runtime declarations follow the supported Node 24 release.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
